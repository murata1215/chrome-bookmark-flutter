name: chrome_bookmark_flutter
description: "ブックマークランチャー"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状態管理（mimamori-flutter と揃える）
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.9.1

  # ローカル保存
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # ペアリング
  mobile_scanner: ^7.3.0
  device_info_plus: ^11.5.0
  uuid: ^4.5.2

  # 表示
  cached_network_image: ^3.4.1

  # 起動
  url_launcher: ^6.3.2
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  # ペアリング手順ガイド（lib/pairing/pairing_guide_screen.dart）が表示する画像。
  # アイコン/スプラッシュ素材と違い、これはアプリが実行時に表示するので登録が必要
  # （アイコン/スプラッシュは生成ツールがビルド時にパスを直接読むだけなので未登録が正しい）。
  assets:
    - assets/guide/

# --- アプリアイコン／スプラッシュ生成設定（dev_dependencies・ビルド時だけ使う。
# アプリ本体には同梱されないので `flutter: assets:` には登録しない） ---
# 生成: python3 tool/gen_icon.py && dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#4A3FB8"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_foreground.png"

flutter_native_splash:
  # AppTheme.light()/dark() の colorScheme.surface と同じ値
  # （ColorScheme.fromSeed(seedColor: AppTheme.seed) の実測値）にして、
  # スプラッシュ→初期画面の色のフラッシュを無くす。
  color: "#FCF8FF"
  color_dark: "#131318"
  image: "assets/branding/splash_logo.png"
  image_dark: "assets/branding/splash_logo.png"
  android_12:
    image: "assets/branding/splash_logo.png"
    icon_background_color: "#FCF8FF"
    color: "#FCF8FF"
    image_dark: "assets/branding/splash_logo.png"
    icon_background_color_dark: "#131318"
    color_dark: "#131318"
  ios: true
  android: true
  web: false
